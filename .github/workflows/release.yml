name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make libcriterion-dev

      - name: Test
        run: make test

      - name: Build release
        run: make release

      - name: Package
        run: |
          mkdir -p dist
          cp build/automata-release dist/automata-linux-x86_64
          strip dist/automata-linux-x86_64
          sha256sum dist/automata-linux-x86_64 > dist/automata-linux-x86_64.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/automata-linux-x86_64
            dist/automata-linux-x86_64.sha256
